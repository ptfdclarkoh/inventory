<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
    <title>PTFD EMS Supply Transactions Log</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
        }
        /* Simple loading spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="antialiased text-gray-900">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-4xl mx-auto px-4">
            <div class="flex justify-center space-x-4">
                <!-- Links to other pages -->
                <a href="index.html" class="text-gray-500 hover:text-blue-600 px-3 py-4 font-medium">Log Inventory</a>
                <a href="transactions.html" class="text-blue-600 border-b-2 border-blue-600 px-3 py-4 font-medium" aria-current="page">View Transactions</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">

        <!-- Data Table Card -->
        <div class="bg-white p-6 rounded-xl shadow-lg h-auto overflow-y-auto">
            
            <!-- Header with Download Button -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800">Transaction Log</h2>
                    <p class="text-gray-500 mt-1">Real-time inventory history.</p>
                </div>
                <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow flex items-center text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download CSV
                </button>
            </div>

            <!-- Search and Filter Controls -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-100">
                <!-- Search Input -->
                <div class="md:col-span-6">
                    <label for="searchInput" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Search</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="text" id="searchInput" placeholder="Search items, people, or reasons..." 
                            class="w-full pl-10 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-shadow">
                    </div>
                </div>

                <!-- Start Date -->
                <div class="md:col-span-3">
                    <label for="startDate" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Start Date</label>
                    <input type="date" id="startDate" 
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-gray-700">
                </div>

                <!-- End Date -->
                <div class="md:col-span-3">
                    <label for="endDate" class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">End Date</label>
                    <input type="date" id="endDate" 
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-gray-700">
                </div>
            </div>

            <!-- Filter Status / Results Count -->
            <div id="resultsCount" class="text-sm text-gray-500 mb-2 hidden">
                Showing <span id="showingCount" class="font-semibold text-gray-900">0</span> of <span id="totalCount">0</span> transactions
            </div>

            <!-- Table Container -->
            <div class="overflow-x-auto rounded-lg border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Date & Time</th>
                            <th class="p-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Item</th>
                            <th class="p-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Quantity</th>
                            <th class="p-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Reason</th>
                            <th class="p-3 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">Logged By</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTable" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
                
                <!-- Loading State -->
                <div id="loadingIndicator" class="flex flex-col items-center justify-center p-8">
                    <div class="spinner"></div>
                    <p class="text-gray-500 mt-4">Loading transactions...</p>
                </div>
                <p id="loadingMessage" class="text-gray-500 text-center p-8" style="display: none;">Authenticating...</p>
                
                <!-- Empty State (Hidden by default) -->
                <div id="emptyState" class="hidden p-8 text-center text-gray-500">
                    <p>No transactions match your filters.</p>
                    <button id="clearFiltersBtn" class="mt-2 text-blue-600 hover:underline text-sm font-medium">Clear Filters</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import functions from the Firebase SDK
        import { initializeApp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            onSnapshot, 
            collection,
            query
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Global Environment Variables ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Fallback config
        const fallbackConfig = {
          apiKey: "AIzaSyBTjbo2ndQYowrvmcDxeXfvNb_E3nSijH8",
          authDomain: "ems-inventory.firebaseapp.com",
          projectId: "ems-inventory",
          storageBucket: "ems-inventory.firebasestorage.app",
          messagingSenderId: "1076236960850",
          appId: "1:1076236960850:web:07cc24cd638ef4a8298b8b",
          measurementId: "G-BFFXWP4G42"
        };
        
        const configToUse = firebaseConfig || fallbackConfig;

        // --- Global Variables ---
        let db;
        let auth;
        let currentUserId;
        let transactionsListener = null;
        let allTransactions = []; // Source of truth from DB
        let displayedTransactions = []; // Filtered list for View & CSV
        
        // --- DOM Elements ---
        const tableBody = document.getElementById('transactionsTable');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadingMessage = document.getElementById('loadingMessage');
        const downloadBtn = document.getElementById('downloadBtn');
        const searchInput = document.getElementById('searchInput');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        const resultsCount = document.getElementById('resultsCount');
        const showingCountSpan = document.getElementById('showingCount');
        const totalCountSpan = document.getElementById('totalCount');
        const emptyState = document.getElementById('emptyState');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');

        /**
         * Helper to format timestamps
         */
        function formatTimestamp(timestamp) {
            if (timestamp && timestamp.toDate) {
                return timestamp.toDate().toLocaleString('en-US', {
                    month: '2-digit',
                    day: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            return 'N/A';
        }

        /**
         * Filtering Logic
         */
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const startDateVal = startDateInput.value;
            const endDateVal = endDateInput.value;

            displayedTransactions = allTransactions.filter(tx => {
                // 1. Text Search
                const item = (tx.item || '').toLowerCase();
                const reason = (tx.reason || '').toLowerCase();
                const person = (tx.person || '').toLowerCase();
                
                const matchesSearch = !searchTerm || 
                                      item.includes(searchTerm) || 
                                      reason.includes(searchTerm) || 
                                      person.includes(searchTerm);

                // 2. Date Filter
                let matchesDate = true;
                if (startDateVal || endDateVal) {
                    if (tx.loggedAt && tx.loggedAt.toDate) {
                        const txDate = tx.loggedAt.toDate();
                        // Reset time part for comparison to include the whole day
                        txDate.setHours(0,0,0,0); 
                        
                        if (startDateVal) {
                            const start = new Date(startDateVal);
                            // Fix Timezone offset issues by treating input as local midnight
                            start.setMinutes(start.getMinutes() + start.getTimezoneOffset()); 
                            if (txDate < start) matchesDate = false;
                        }
                        
                        if (endDateVal) {
                            const end = new Date(endDateVal);
                            end.setMinutes(end.getMinutes() + end.getTimezoneOffset());
                            if (txDate > end) matchesDate = false;
                        }
                    }
                }

                return matchesSearch && matchesDate;
            });

            updateUI();
        }

        function updateUI() {
            renderTable(displayedTransactions);
            
            // Update counts
            showingCountSpan.textContent = displayedTransactions.length;
            totalCountSpan.textContent = allTransactions.length;
            
            // Show/Hide count text
            if (allTransactions.length > 0) {
                resultsCount.classList.remove('hidden');
            }
        }

        function clearFilters() {
            searchInput.value = '';
            startDateInput.value = '';
            endDateInput.value = '';
            applyFilters();
        }

        // --- Event Listeners for Filters ---
        searchInput.addEventListener('input', applyFilters);
        startDateInput.addEventListener('change', applyFilters);
        endDateInput.addEventListener('change', applyFilters);
        clearFiltersBtn.addEventListener('click', clearFilters);

        /**
         * CSV Download Functionality
         */
        function downloadCSV() {
            // Use displayedTransactions to respect filters
            if (!displayedTransactions || displayedTransactions.length === 0) {
                alert("No data to download matching current filters.");
                return;
            }

            const headers = ["Date & Time", "Item", "Quantity Taken", "Reason", "Logged By"];
            const csvRows = [];
            csvRows.push(headers.join(","));

            displayedTransactions.forEach(tx => {
                const escape = (text) => {
                    if (text === null || text === undefined) return '';
                    const stringText = String(text);
                    if (stringText.includes(',') || stringText.includes('"') || stringText.includes('\n')) {
                        return `"${stringText.replace(/"/g, '""')}"`;
                    }
                    return stringText;
                };

                const row = [
                    escape(formatTimestamp(tx.loggedAt)),
                    escape(tx.item),
                    escape(tx.quantityTaken),
                    escape(tx.reason),
                    escape(tx.person)
                ];
                csvRows.push(row.join(","));
            });

            const csvString = csvRows.join("\n");
            const blob = new Blob([csvString], { type: "text/csv" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.setAttribute("hidden", "");
            a.setAttribute("href", url);
            a.setAttribute("download", `inventory_transactions_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        downloadBtn.addEventListener('click', downloadCSV);


        /**
         * Renders the data into the HTML table.
         */
        function renderTable(transactions) {
            tableBody.innerHTML = ''; 
            
            if (transactions.length === 0) {
                emptyState.classList.remove('hidden');
                // If no transactions exist at all (not just filtered), handle that differently
                if (allTransactions.length === 0) {
                   emptyState.innerHTML = `<p>No transactions found in database.</p>`;
                } else {
                   // Standard filter empty state
                   emptyState.innerHTML = `
                        <p>No transactions match your filters.</p>
                        <button id="innerClearBtn" class="mt-2 text-blue-600 hover:underline text-sm font-medium">Clear Filters</button>
                   `;
                   // Re-bind the dynamic button
                   document.getElementById('innerClearBtn').addEventListener('click', clearFilters);
                }
                downloadBtn.disabled = true;
                return;
            }

            emptyState.classList.add('hidden');
            downloadBtn.disabled = false;

            transactions.forEach(tx => {
                const loggedDate = formatTimestamp(tx.loggedAt);

                const row = `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-3 whitespace-nowrap text-sm text-gray-500">${loggedDate}</td>
                        <td class="p-3 whitespace-nowrap text-sm font-semibold text-gray-900">${tx.item || ''}</td>
                        <td class="p-3 whitespace-nowrap text-sm text-gray-500">${tx.quantityTaken || ''}</td>
                        <td class="p-3 whitespace-nowrap text-sm text-gray-500">${tx.reason || ''}</td>
                        <td class="p-3 whitespace-nowrap text-sm text-gray-500">${tx.person || ''}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }
        
        /**
         * Attaches the Firestore listener
         */
        function attachDataListener() {
            if (transactionsListener) {
                transactionsListener(); 
            }
            
            const collectionRef = collection(db, 'transactions'); 

            transactionsListener = onSnapshot(collectionRef, (querySnapshot) => {
                const transactions = [];
                querySnapshot.forEach((doc) => {
                    transactions.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort: Newest first
                transactions.sort((a, b) => {
                    const dateA = a.loggedAt?.toDate ? a.loggedAt.toDate() : new Date(0);
                    const dateB = b.loggedAt?.toDate ? b.loggedAt.toDate() : new Date(0);
                    return dateB - dateA; 
                });

                allTransactions = transactions; // Update Source of Truth
                applyFilters(); // Apply current filters to new data
                
                // Hide loading indicators
                loadingIndicator.style.display = 'none';
                loadingMessage.style.display = 'none';
                
            }, (error) => {
                console.error('Error getting documents:', error);
                loadingMessage.textContent = `Error loading data: ${error.message}`;
                loadingMessage.className = 'text-red-500 text-center p-8';
            });
        }

        /**
         * --- APP INITIALIZATION ---
         */
        function initApp() {
            try {
                const app = initializeApp(configToUse);
                db = getFirestore(app);
                auth = getAuth(app);
                
                loadingMessage.style.display = 'block';

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUserId = user.uid;
                        loadingMessage.textContent = 'Authenticated. Loading transactions...';
                        attachDataListener();
                    } else {
                        currentUserId = null;
                        loadingMessage.textContent = 'Authenticating...';
                        try {
                            if (initialAuthToken) {
                                await signInWithCustomToken(auth, initialAuthToken);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (error) {
                            console.error('Error signing in:', error);
                            loadingMessage.textContent = `Authentication Failed: ${error.message}`;
                        }
                    }
                });

            } catch (error) {
                console.error('Error initializing app:', error);
                loadingIndicator.style.display = 'none';
                loadingMessage.textContent = `Critical Error: ${error.message}`;
                loadingMessage.style.display = 'block';
            }
        }

        initApp();
    </script>
</body>
</html>
